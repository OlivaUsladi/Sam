spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

server.port=8080

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-ttl-minutes=15
app.security.jwt.refresh-ttl-days=30

app.security.email.hmac-key=${EMAIL_HMAC_KEY}
app.security.email.aes-key=${EMAIL_AES_KEY}

app.security.consent.current-version=1.0
app.security.password-reset.ttl-minutes=15