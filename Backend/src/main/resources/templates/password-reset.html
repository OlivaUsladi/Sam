<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .logo { text-align: center; margin-bottom: 24px; font-size: 28px; font-weight: bold; color: #FF6B00; }
        h2 { color: #1a1a1a; margin-bottom: 16px; }
        p { color: #4a4a4a; line-height: 1.6; }
        .btn { display: inline-block; background: #FF6B00; color: #ffffff !important; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; margin: 24px 0; }
        .note { font-size: 13px; color: #888; margin-top: 24px; }
        .footer { text-align: center; margin-top: 32px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">SAM</div>
    <h2>Восстановление пароля</h2>
    <p>Вы запросили сброс пароля для вашего аккаунта в приложении SAM.</p>
    <p>Нажмите кнопку ниже или скопируйте ссылку в браузер:</p>
    <p style="text-align: center;">
        <a class="btn" th:href="${resetLink}">Сбросить пароль</a>
    </p>
    <p class="note">
        Ссылка действительна <span th:text="${ttlMinutes}">15</span> минут.<br/>
        Если вы не запрашивали сброс пароля, просто проигнорируйте это письмо.
    </p>
</div>
<div class="footer">SAM &mdash; Система Автоматизации Меню</div>
</body>
</html>
