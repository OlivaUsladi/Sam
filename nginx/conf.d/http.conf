# Port 80: ACME challenge (for Let's Encrypt) + redirect to HTTPS.
# This file is always active. It must NOT reference SSL certificates,
# so nginx can start even before certificates exist.
server {
    listen 80;
    server_name sam-app.ru api.sam-app.ru;

    # Let's Encrypt / Certbot validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
