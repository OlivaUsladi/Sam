# HTTP → HTTPS redirect + Let's Encrypt challenge
server {
    listen 80;
    server_name sam-app.ru api.sam-app.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API backend (api.sam-app.ru)
server {
    listen 443 ssl;
    server_name api.sam-app.ru;

    ssl_certificate /etc/letsencrypt/live/sam-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sam-app.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Main domain (sam-app.ru) — landing page / APK download
server {
    listen 443 ssl;
    server_name sam-app.ru;

    ssl_certificate /etc/letsencrypt/live/sam-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sam-app.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html;
    index index.html;

    # Password reset deep link handling (redirects to app)
    location /reset-password {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
